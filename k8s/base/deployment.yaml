apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapx-video
  namespace: fiapx
  labels:
    app: fiapx-video
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fiapx-video
  template:
    metadata:
      labels:
        app: fiapx-video
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # S3 access comes from the EKS node group's IAM role (or an IRSA
      # service account, if configured in fiapx-infra) — no static AWS
      # keys are injected here.
      containers:
        - name: app
          image: fiapx-video-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: fiapx-video-config
            - secretRef:
                name: fiapx-video-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
