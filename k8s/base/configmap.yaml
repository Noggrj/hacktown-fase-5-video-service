apiVersion: v1
kind: ConfigMap
metadata:
  name: fiapx-video-config
  namespace: fiapx
data:
  PORT: "8080"
  APP_ENV: "production"
  SERVICE_NAME: "fiapx-video-service"
  S3_BUCKET: "fiapx-videos-production"
  AWS_REGION: "us-east-1"
  # host:port only — the RabbitMQ-style "amqp://user:pass@" shape doesn't
  # apply to Kafka; broker auth (if any) is handled by SASL config, not
  # used in this project's self-hosted single-broker setup.
  KAFKA_BROKERS: "kafka.fiapx.svc.cluster.local:9092"
  REDIS_ADDR: "redis.fiapx.svc.cluster.local:6379"
