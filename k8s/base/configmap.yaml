# S3_BUCKET abaixo é um placeholder: o bucket real leva o account id AWS
# no nome (ver fiapx-infra/terraform/main.tf — "fiapx-videos-${account_id}",
# de propósito, pra não colidir com outra conta AWS Academy que já usou
# esse nome). O job "deploy" do CI substitui esse valor pelo nome real
# (Secret/Variable S3_BUCKET_NAME) antes de aplicar — nunca aplique este
# arquivo direto contra produção sem essa substituição.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fiapx-video-config
  namespace: fiapx
data:
  PORT: "8080"
  APP_ENV: "production"
  SERVICE_NAME: "fiapx-video-service"
  S3_BUCKET: "fiapx-videos-production"
  AWS_REGION: "us-east-1"
  # host:port only — the RabbitMQ-style "amqp://user:pass@" shape doesn't
  # apply to Kafka; broker auth (if any) is handled by SASL config, not
  # used in this project's self-hosted single-broker setup.
  KAFKA_BROKERS: "kafka.fiapx.svc.cluster.local:9092"
  REDIS_ADDR: "redis.fiapx.svc.cluster.local:6379"
