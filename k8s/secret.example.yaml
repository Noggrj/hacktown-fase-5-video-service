# Exemplo apenas — NUNCA commitar o valor real. Fica FORA de k8s/base/ de
# propósito (ver a mesma lição em fiapx-auth-service/k8s/secret.example.yaml).
#
# JWT_SECRET MUST match every other fiapx-* service's JWT_SECRET.
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-video-secret
  namespace: fiapx
type: Opaque
stringData:
  DB_URL: "postgres://video:CHANGE_ME@host:5432/fiapx_video?sslmode=require"
  JWT_SECRET: "CHANGE_ME_TO_A_RANDOM_32_BYTE_VALUE"
