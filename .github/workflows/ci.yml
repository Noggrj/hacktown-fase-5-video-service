name: CI — fiapx-video-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  COVERAGE_MIN: "70"
  # Packages with real business logic. Excluded from the gate:
  #   cmd/api                                — process wiring
  #   internal/platform/{db,cache,storage,messaging,idempotency} — thin
  #     wrappers around Postgres/Redis/S3/Kafka, need live infra to test
  #     meaningfully (not wired into CI yet — see fiapx-video-service README)
  #   internal/platform/logging              — 3-line slog wrapper
  #   internal/video/gateway                 — Postgres/Redis repo impls
  #   internal/saga                          — Kafka wiring, covered indirectly
  #     by fiapx-events' own transport/kafka tests
  COVERAGE_PKGS: "./internal/video/domain/... ./internal/video/usecase/... ./internal/video/delivery/... ./internal/platform/jwt/... ./internal/platform/httpauth/... ./internal/platform/health/... ./internal/platform/config/... ./internal/platform/metrics/..."

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fiapx-video-service
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2
          args: --timeout=5m

      - name: Run full test suite
        run: go test -count=1 -race -timeout 120s ./...

      - name: Coverage (business-logic packages only)
        run: |
          go test -count=1 -coverprofile=coverage.out ${{ env.COVERAGE_PKGS }}
          go tool cover -func=coverage.out | tail -10

      - name: Coverage gate (>= ${{ env.COVERAGE_MIN }}%)
        run: |
          PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "::notice::Coverage = $PCT% (gate $COVERAGE_MIN%)"
          awk -v p="$PCT" -v m="$COVERAGE_MIN" 'BEGIN{exit (p+0<m+0)?1:0}'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage
          path: coverage.out
          retention-days: 5

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout fiapx-video-service
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local only — no registry push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fiapx-video-service:ci
          build-args: VERSION=${{ github.sha }}

      - name: Container smoke test (local build only)
        run: |
          docker run --rm fiapx-video-service:ci ./server --version
